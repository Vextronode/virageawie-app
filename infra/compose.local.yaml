# Local development services.
#   docker compose -f infra/compose.local.yaml up -d
name: virageawie-local

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-virageawie}
      POSTGRES_USER: ${DB_USERNAME:-virageawie}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-local-password}
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 images keep data in /var/lib/postgresql/18/docker.
      - postgres_local:/var/lib/postgresql
      - ./postgres/init-local.sql:/docker-entrypoint-initdb.d/10-init-local.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_local:
