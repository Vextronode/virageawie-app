name: CI

on:
  pull_request:
    branches: [dev, main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.4"
  PHP_EXTENSIONS: pdo_pgsql, intl, bcmath, zip
  DB_CONNECTION: pgsql
  DB_HOST: 127.0.0.1
  DB_PORT: "5432"
  DB_USERNAME: virageawie
  DB_PASSWORD: ci-only-password

jobs:
  pr-checks:
    name: Pull request checks
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title (Conventional Commits)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|refactor|chore|docs|test|ci|build|perf)(\([a-z0-9._/-]+\))?!?: .+'
          if printf '%s' "$PR_TITLE" | grep -Eq "$pattern"; then
            echo "PR title OK: $PR_TITLE"
          else
            echo "::error::PR title must follow Conventional Commits, for example 'feat(cash): add cash in form'. Got: $PR_TITLE"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check local-only files
        env:
          LOCAL_ONLY_PATHS: ${{ vars.LOCAL_ONLY_PATHS }}
        run: |
          if [ -z "${LOCAL_ONLY_PATHS// /}" ]; then
            echo "LOCAL_ONLY_PATHS is not set; nothing to check."
            exit 0
          fi
          # Each entry matches that file or folder at the root and at any depth.
          read -r -a entries <<< "$LOCAL_ONLY_PATHS"
          pathspecs=()
          for entry in "${entries[@]}"; do
            entry="${entry#/}"
            entry="${entry%/}"
            pathspecs+=(":(glob)**/$entry" ":(glob)**/$entry/**")
          done
          tracked="$(git ls-files -- "${pathspecs[@]}" | sort -u)"
          if [ -n "$tracked" ]; then
            echo "::error::These files must stay local and may not be committed:"
            echo "$tracked"
            exit 1
          fi
          echo "No local-only files are tracked."

      - name: Warn on large changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$(git diff --numstat "$BASE_SHA...$HEAD_SHA" -- . \
            ':(exclude)**/composer.lock' ':(exclude)**/package-lock.json' ':(exclude)*.lock' \
            | awk '$1 != "-" { total += $1 + $2 } END { print total + 0 }')"
          echo "Changed lines (excluding lock files): $changed"
          if [ "$changed" -gt 400 ]; then
            echo "::warning::This PR changes $changed lines (limit 400, lock files excluded). Consider splitting it."
          fi

  php:
    name: PHP (Pint, PHPStan, Pest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: virageawie_test
          POSTGRES_USER: virageawie
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U virageawie -d virageawie_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_DATABASE: virageawie_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          tools: composer:v2
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: src/.nvmrc
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('src/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Build frontend assets for feature tests
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Pest
        run: vendor/bin/pest

  frontend:
    name: Frontend (lint, format, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Wayfinder generates the typed route files from the Laravel routes.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          tools: composer:v2
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: src/.nvmrc
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate --no-interaction
          npm ci --no-audit --no-fund

      - name: Generate route types
        run: php artisan wayfinder:generate --with-form

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run types

      - name: Build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          tools: composer:v2
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: src/.nvmrc

      - name: Composer audit
        run: composer audit --locked --no-interaction

      - name: npm audit
        run: npm audit --audit-level=high

  migrations:
    name: Migrations on empty database
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: virageawie_migrate
          POSTGRES_USER: virageawie
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U virageawie -d virageawie_migrate"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_DATABASE: virageawie_migrate
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Migrate
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          php artisan migrate --force --no-interaction
